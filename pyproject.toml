[project]
name = "dafny-of-python"
version = "0.1.0"
description = "Translate a typed Python subset to Dafny"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mypy==1.18.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["test/python"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
